# Stage 2 config: duplex fine-tune on real otoSpeech-full-duplex-task-oriented-20h data.
# Copy this file (e.g. stage2_colab.yaml / stage2_hpc.yaml) if Colab and the
# HPC cluster need different paths/batch sizes -- don't hand-edit in place
# between the two environments.

models:
  wavlm_name: "microsoft/wavlm-base-plus"
  qwen_name: "Qwen/Qwen2.5-1.5B-Instruct"
  vocos_repo: "charactr/vocos-mel-24khz"

audio:
  chunk_duration_s: 8.0     # target training chunk length; the final chunk of each session is shorter
                            # and kept (not dropped) as long as it's >= min_chunk_s -- see stage2_duplex.py
  min_chunk_s: 1.0          # shorter trailing remainders than this are dropped, too little signal to bother with
  n_mels: 100               # must match charactr/vocos-mel-24khz's own feature extractor
  user_channel: 0           # Run dataprep/print_channel_roles.py and confirm this yourself -- NOTE: this
  agent_channel: 1          # dataset may turn out to be peer-to-peer (no real "agent" role), in which case
                            # this is just a fixed, consistent choice of which channel the model learns to
                            # produce, not "which one is really the user/agent". See that script's output.
  channel_roles_verified: false   # train/stage2_duplex.py refuses to start unless this is true.

lora:
  r: 16
  alpha: 32
  dropout: 0.05

train:
  batch_size: 4             # A100 40GB: start here and raise if memory allows; H100 80GB can go higher
  lr: 2.0e-4
  max_steps: 20000
  save_every: 500
  log_every: 10
  num_workers: 4

runtime:
  device: "cuda"
  dtype: "bf16"             # A100/H100 both support bf16 natively; falls back to fp32 math inside autocast if not

paths:
  manifest_path: "processed/manifest.json"
  checkpoint_dir: "checkpoints/stage2"
