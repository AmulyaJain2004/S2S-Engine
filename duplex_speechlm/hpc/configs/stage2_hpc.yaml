# Stage 2 config for the college H100 PBS cluster.
# EDIT the two scratch paths below to match your actual cluster scratch/home
# quota paths before qsub-ing -- these are placeholders.
#
# ARCHITECTURE: discrete units (WavLM-large + k-means(1000), pretrained and
# frozen), not continuous mel regression -- see
# speechcore/discrete_tokenizer.py's docstring for the full reasoning.

models:
  qwen_name: "Qwen/Qwen2.5-1.5B-Instruct"

discrete:
  ssl_model: "wavlm-large"
  layer_num: 7
  num_clusters: 1000
  kmeans_dataset: "LJSpeech"
  kmeans_repo_id: "speechbrain/SSL_Quantization"
  vocoder_repo_id: "speechbrain/hifigan-wavlm-k1000-LibriTTS"

audio:
  chunk_duration_s: 8.0
  min_chunk_s: 1.0
  user_channel: 0           # Run dataprep/print_channel_roles.py and confirm this yourself -- NOTE: this
  agent_channel: 1          # dataset may turn out to be peer-to-peer (no real "agent" role), in which case
                            # this is just a fixed, consistent choice of which channel the model learns to
                            # produce, not "which one is really the user/agent". See that script's output.
  channel_roles_verified: false   # train/stage2_duplex.py refuses to start unless this is true.

lora:
  r: 16
  alpha: 32
  dropout: 0.05

train:
  batch_size: 8             # H100 80GB has more headroom than the A100 40GB default in configs/stage2.yaml
  lr: 2.0e-4
  max_steps: 20000
  save_every: 500
  log_every: 20
  num_workers: 8

runtime:
  device: "cuda"
  dtype: "bf16"

paths:
  manifest_path: "/scratch/CHANGE_ME/s2s-engine/processed/manifest.json"
  checkpoint_dir: "/scratch/CHANGE_ME/s2s-engine/checkpoints/stage2_discrete"
